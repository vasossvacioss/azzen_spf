[package]
name = "spf_web_console"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-files = "0.6.8"
actix-web = "4.11.0"
askama = "0.14.0"
chrono = { version = "0.4.42", features = ["serde"] }
csv = "1.4.0"
dotenvy = "0.15.7"
rust_xlsxwriter = "0.92.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
argon2 = "0.5.3"
actix-multipart = "0.8.5"
futures-util = "0.3.34"
sha2 = "0.10.9"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
totp-rs = { version = "6.0.0", features = ["otpauth", "gen_secret"] }
qrcode = "0.14.1"
aes-gcm = "0.11.1"
urlencoding = "2.1"
log = "0.4"
env_logger = "0.11"
